tooltip: |
  Automatically assign ConnectorC1Type and ConnectorC2Type for all round ducts in active view:
  If connected to Round Joiner, assign "Joiner" to one end & "RE" to the opposite end (forming an RE–Joiner–RE sequence).
  For all other connections (including Round Bends, accessories), assign "RE".
Title: "Active View Spiros"
Author: Ky Ha